[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-toolkit"
version = "0.1.0"
description = "A specialized research toolkit for literature discovery, Zotero integration, NotebookLM synthesis, and Obsidian PKM distillation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ling", email = "ling@example.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pyzotero>=1.5.0",
    "notebooklm-py>=0.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "rookiepy>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
research-toolkit = "research_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_toolkit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
